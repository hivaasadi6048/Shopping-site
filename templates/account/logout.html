{% extends '_base.html' %}
{% load i18n %}

{% block title %}خروج | ZHIRO{% endblock %}

{% block content %}
  <div class="auth-wrapper">
    <h1>{% trans 'خروج از حساب کاربری' %}</h1>

    <form method="post" novalidate>
      {% csrf_token %}
      <input type="submit" value="{% trans 'خروج' %}" class="btn">
    </form>

    <p>
      <a href="{% url 'account_login' %}">{% trans 'ورود مجدد' %}</a>
    </p>
  </div>
{% endblock %}
